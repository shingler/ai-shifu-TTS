# Nginx for AI-Shifu-TTS — Apache-fronted variant
# Use when Apache already owns port 80 and forwards :80 -> this Nginx on :88.
# Linux: cp this file to /etc/nginx/conf.d/ai-shifu-88.conf
#
# Differences from deploy/nginx/ai-shifu.conf:
#   - listens on 88 instead of 80
#   - real client IP / proto come from Apache via X-Forwarded-* headers

upstream api_backend {
    server 127.0.0.1:5800;
    keepalive 32;
}

upstream frontend_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 88 default_server;
    listen [::]:88 default_server;
    server_name _;

    # Large file upload support
    client_max_body_size 3000m;

    # Logging
    access_log /var/log/nginx/ai-shifu-access.log;
    error_log  /var/log/nginx/ai-shifu-error.log warn;

    # --------------------------------------------------
    # Next.js static assets → 直接从磁盘读取，不需要过 Node
    # alias points at the build output dir — always fresh after `npm run build`,
    # so NO post-build copy into .next/standalone/ is needed.
    # --------------------------------------------------
    location /_next/static/ {
        alias /home/ai-shifu-TTS/src/cook-web/.next/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --------------------------------------------------
    # Cook Web i18n/config API → Next.js frontend
    # --------------------------------------------------
    location /api/i18n {
        proxy_pass http://frontend_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/config {
        proxy_pass http://frontend_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # --------------------------------------------------
    # Backend API → Flask (Gunicorn)
    # --------------------------------------------------
    location /api/ {
        proxy_pass http://api_backend/api/;
        proxy_http_version 1.1;

        # Streaming / SSE support
        proxy_buffering     off;
        proxy_send_timeout  3600s;
        proxy_read_timeout  3600s;
        proxy_connect_timeout 3600s;

        # File upload
        client_max_body_size 3000m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --------------------------------------------------
    # Frontend (Next.js) → 代理到 standalone server
    # --------------------------------------------------
    location / {
        proxy_pass http://frontend_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

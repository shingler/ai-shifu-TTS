# Apache vhost for AI-Shifu-TTS — fronting Nginx on :88
# Apache keeps port 80 (e.g. it also serves other sites) and forwards
# everything to the Nginx config in deploy/nginx/ai-shifu-88.conf.
#
# CentOS 7 / RHEL:  cp to /etc/httpd/conf.d/ai-shifu.conf
#                   modules are loaded by default; verify with
#                   httpd -M | grep -E 'proxy|proxy_http'
# Debian / Ubuntu:  cp to /etc/apache2/sites-available/ai-shifu.conf
#                   a2enmod proxy proxy_http && a2ensite ai-shifu
#
# Requires mod_proxy + mod_proxy_http.
# On SELinux systems (CentOS 7), allow the web server to open local ports:
#   sudo setsebool -P httpd_can_network_connect 1

<VirtualHost *:80>
    ServerName your-domain.com

    # Forward-only vhost, not an open proxy
    ProxyRequests Off

    # Pass the original Host header through so Nginx / the frontend
    # see the real domain (the frontend builds API URLs from it)
    ProxyPreserveHost On

    # Keep long-running SSE / streaming requests alive
    ProxyTimeout 3600

    # flushpackets=on: forward SSE chunks immediately instead of buffering
    ProxyPass / http://127.0.0.1:88/ flushpackets=on retry=0
    ProxyPassReverse / http://127.0.0.1:88/

    ErrorLog logs/ai-shifu-apache-error.log
    CustomLog logs/ai-shifu-apache-access.log combined
</VirtualHost>
